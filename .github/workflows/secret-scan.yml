  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shared-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@3712b88f438b046e68fe37d8db2f4b6a4387b473
    with:
      policy-revision: 3712b88f438b046e68fe37d8db2f4b6a4387b473
