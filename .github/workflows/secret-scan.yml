name: Shared source security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shared-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@d829db7aa46e3789eb1b339f1ab1ad7e5d780d49
    with:
      policy-revision: d829db7aa46e3789eb1b339f1ab1ad7e5d780d49
