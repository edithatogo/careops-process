name: Shared source security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shared-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: edithatogo/careops/.github/workflows/reusable-source-security.yml@2c2491a1b500a4c5ec1e6abb9adf33efb4237c25
    with:
      policy-revision: 2c2491a1b500a4c5ec1e6abb9adf33efb4237c25
