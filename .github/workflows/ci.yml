name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.14 quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check --diff .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run bandit -q -r src
      - name: Upgrade audited packaging tool to the fixed release
        run: uv pip install --python .venv/bin/python --upgrade "pip>=26.2"
      - run: uv run --no-sync pip-audit
