name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.14 quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --group dev
      - run: uv run python scripts/validate_conductor.py
      - run: uv run ruff format --check --diff .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/check_coverage.py coverage.xml
      - name: Offline exporter and ALM regression checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem tests/powershell/test_*.ps1)
          if ($tests.Count -eq 0) { throw 'No offline PowerShell tests found' }
          foreach ($test in $tests) {
            & pwsh -NoProfile -File $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($test.Name)" }
          }
      - run: uv run bandit -q -r src
      - run: uv run --no-sync pip-audit

  optional-mining:
    name: Optional PM4Py import boundary
    if: vars.ENABLE_PM4PY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --group dev --extra mining
      - run: uv run --no-sync python scripts/check_pm4py.py
      - run: uv run --no-sync pip-audit
