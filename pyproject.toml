[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "careops-process"
version = "0.1.0"
description = "Privacy-preserving object-centric process intelligence for CareOps"
requires-python = ">=3.14,<3.15"
dependencies = [
  "defusedxml>=0.7.1",
  "polars>=1.33",
  "pyarrow>=21",
  "pydantic>=2.11",
]

[project.scripts]
careops-process-smoke = "careops_process.cli:main"

[project.optional-dependencies]
mining = ["pm4py==2.7.23.8"]

[dependency-groups]
build = [
    "hatchling==1.32.4",
]
dev = [
  "bandit>=1.8",
  "hypothesis>=6.135",
  "pip-audit>=2.9",
  "pyright>=1.1.403",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/careops_process"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=careops_process --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".agents/plugins/**"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/build-executive-landscape.py" = ["N999"]
"scripts/build-closed-run-report.py" = ["N999"]
"scripts/validate-executive-validation.py" = ["N999"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportUnknownMemberType = false

[tool.coverage.run]
branch = true
source = ["careops_process"]
